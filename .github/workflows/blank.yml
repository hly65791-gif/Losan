name: Build Lisan APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Show project root
        run: |
          pwd
          ls -la

      - name: Grant execute on gradlew (if present)
        run: chmod +x gradlew || true

      - name: Bootstrap Gradle Wrapper if missing
        run: |
          if [ ! -x ./gradlew ]; then
            echo "gradlew missing — bootstrapping"
            if [ -f tools/gradle/bootstrap-gradle.sh ]; then
              bash tools/gradle/bootstrap-gradle.sh .
            else
              echo "No bootstrap script found"
              exit 1
            fi
          fi
          ./gradlew --version

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Assemble Release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Bundle Release AAB (unsigned)
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: List build outputs
        if: always()
        run: |
          echo "=== APKs ==="
          find app/build/outputs/apk -name '*.apk' || true
          echo "=== AABs ==="
          find app/build/outputs/bundle -name '*.aab' || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisan-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lisan-aab
          path: |
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            **/build/reports/**
          if-no-files-found: warn
