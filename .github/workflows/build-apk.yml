name: Build Lisan APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Lisan Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Lisan ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Lisan ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Lisan
        run: |
          set -e

          rm -rf lisan-project
          mkdir -p lisan-project

          unzip -q "$ZIP_FILE" -d lisan-project

          echo "Extracted project:"
          find lisan-project -maxdepth 3 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Locate Gradle project
        run: |
          set -e

          GRADLEW=$(find lisan-project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Lisan project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Validate APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "======================================"
          echo "LISAN APK BUILD SUCCESS"
          echo "======================================"

          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Lisan APK
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-Debug-APK
          path: lisan-project/**/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
