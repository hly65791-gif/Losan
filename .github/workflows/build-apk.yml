name: Build Lisan APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Lisan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract Lisan ZIP
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -lah

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "📦 ZIP found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -type f | head -100

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "❌ لم يتم العثور على gradlew داخل ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "✅ Lisan project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Lisan project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Lisan Project ==="
          pwd
          ls -lah

          echo "=== Gradle files ==="
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "❌ gradlew غير موجود"
            exit 1
          fi

          chmod +x ./gradlew

          echo "=== Gradle Version ==="
          ./gradlew --version

      - name: Run tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew test --stacktrace --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Build Release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Build Release AAB
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:bundleRelease \
            --stacktrace \
            --no-daemon

      - name: Validate build outputs
        shell: bash
        run: |
          set -e

          echo "================ APK FILES ================"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

          echo "================ AAB FILES ================"
          find "$PROJECT_DIR" -type f -name "*.aab" -print

          DEBUG_APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*debug*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "❌ Debug APK was not generated"
            exit 1
          fi

          echo "============================================"
          echo "✅ Lisan Debug APK generated successfully"
          echo "============================================"

          file "$DEBUG_APK"
          ls -lh "$DEBUG_APK"

          echo "SHA256:"
          sha256sum "$DEBUG_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-Release-AAB
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lisan-Build-Reports
          path: |
            extracted/**/build/reports/**
          if-no-files-found: warn
